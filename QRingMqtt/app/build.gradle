plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------------------------
// APK RHM V0.1 (montres DM100 / DM80) : identité FIXE dans l'APK (cahier des charges V0.1).
// Le numéro de la gateway s'INCRÉMENTE À CHAQUE COMPILATION de la variante :
//   1re compilation rhmDm100 → AND-DM100-0001, 2e → AND-DM100-0002 … (une APK = une montre)
// Compteur gardé dans app/rhm_build_counter.properties (à versionner avec le code).
// ---------------------------------------------------------------------------------------------
def rhmCounterFile = file('rhm_build_counter.properties')
def rhmCounters = new Properties()
if (rhmCounterFile.exists()) rhmCounterFile.withInputStream { rhmCounters.load(it) }
def rhmTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def rhmNextId = { String model ->
    int n = (rhmCounters.getProperty(model, '0') as int)
    // +1 seulement quand on COMPILE cette variante (pas à la synchro Gradle d'Android Studio)
    if (rhmTasks.any { (it.contains('assemble') || it.contains('bundle') || it.contains('install')) && it.contains('rhm' + model.toLowerCase()) }) {
        n++
        rhmCounters.setProperty(model, n.toString())
        rhmCounterFile.withOutputStream { rhmCounters.store(it, 'Compteur des identites RHM : +1 a chaque compilation') }
    }
    return String.format('AND-%s-%04d', model, Math.max(n, 1))
}

android {
    namespace 'com.eis.qringmqtt'
    compileSdk 35

    defaultConfig {
        applicationId "com.eis.qringmqtt"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
        vectorDrawables { useSupportLibrary true }
    }

    // « classic » = app actuelle (TV, eis/colmi) ; « rhmDm100 » / « rhmDm80 » = APK RHM V0.1 (rhm/… seulement)
    flavorDimensions 'cible'
    productFlavors {
        classic {
            dimension 'cible'
            buildConfigField 'boolean', 'RHM_ONLY', 'false'
            buildConfigField 'String', 'RHM_CLIENT_CODE', '""'
            buildConfigField 'String', 'RHM_SITE_CODE', '""'
            buildConfigField 'String', 'RHM_GATEWAY_ID', '""'
            buildConfigField 'String', 'RHM_DEVICE_MODEL', '""'
        }
        rhmDm100 {
            dimension 'cible'
            def gid = rhmNextId('DM100')
            versionNameSuffix "-rhm-" + gid
            // ---- IDENTITÉ (un seul endroit) ----
            buildConfigField 'boolean', 'RHM_ONLY', 'true'
            buildConfigField 'String', 'RHM_CLIENT_CODE', '"CSTOCK"'
            buildConfigField 'String', 'RHM_SITE_CODE', '"SSTOCK"'
            buildConfigField 'String', 'RHM_GATEWAY_ID', '"' + gid + '"'
            buildConfigField 'String', 'RHM_DEVICE_MODEL', '"DM100"'
        }
        rhmDm80 {
            dimension 'cible'
            def gid = rhmNextId('DM80')
            versionNameSuffix "-rhm-" + gid
            buildConfigField 'boolean', 'RHM_ONLY', 'true'
            buildConfigField 'String', 'RHM_CLIENT_CODE', '"CSTOCK"'
            buildConfigField 'String', 'RHM_SITE_CODE', '"SSTOCK"'
            buildConfigField 'String', 'RHM_GATEWAY_ID', '"' + gid + '"'
            buildConfigField 'String', 'RHM_DEVICE_MODEL', '"DM80"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    packagingOptions {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    // SDK QRing (fourni par le fabricant)
    implementation files('libs/qring_sdk_1.0.0.7.aar')

    // Dépendances utilisées par le SDK (présentes dans l'app exemple)
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // MQTT
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // AndroidX / Compose
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
